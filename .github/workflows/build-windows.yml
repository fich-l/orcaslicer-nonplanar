# Windows build of OrcaSlicer Nonplanar: upstream OrcaSlicer at the pinned commit
# + orca-nonplanar.patch, built like OrcaSlicer's own CI (build_release_vs.bat),
# packed as a portable ZIP.  x64 also runs the nonplanar C++ tests and slices
# the test models.
name: Build Windows

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Architectures"
        type: choice
        options: [both, x64, arm64]
        default: both
  push:
    tags: ["v*"]

env:
  ORCA_COMMIT: 8500fcdccaa10b5099ac20d252af3a7c560046f1   # OrcaSlicer v2.4.2

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.m.outputs.include }}
    steps:
      - id: m
        shell: bash
        run: |
          x64='{"arch":"x64","os":"windows-latest","build_dir":"build","dep_dir":"build/OrcaSlicer_dep","bat_arch":""}'
          arm='{"arch":"arm64","os":"windows-11-arm","build_dir":"build-arm64","dep_dir":"build-arm64/OrcaSlicer_dep","bat_arch":"arm64"}'
          case "${{ inputs.arch || 'both' }}" in
            x64) echo "include=[$x64]" >> "$GITHUB_OUTPUT";;
            arm64) echo "include=[$arm]" >> "$GITHUB_OUTPUT";;
            *) echo "include=[$x64,$arm]" >> "$GITHUB_OUTPUT";;
          esac

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Keep line endings (the patch has LF)
        run: git config --global core.autocrlf false

      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: np

      - name: Check out OrcaSlicer ${{ env.ORCA_COMMIT }}
        uses: actions/checkout@v4
        with:
          repository: OrcaSlicer/OrcaSlicer
          ref: ${{ env.ORCA_COMMIT }}
          path: orca
          lfs: false

      - name: Apply the nonplanar patch
        working-directory: orca
        run: git apply --whitespace=nowarn ../np/orca-nonplanar.patch

      - name: Version
        run: |
          $v = (Select-String -Path orca/version.inc -Pattern 'ORCA_NONPLANAR_VERSION "v([^"]+)"').Matches[0].Groups[1].Value
          "NP_VERSION=$v" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "Version $v"

      - name: Restore cached dependencies
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: orca/deps/${{ matrix.dep_dir }}
          key: windows-${{ matrix.arch }}-orca-deps-${{ env.ORCA_COMMIT }}-${{ hashFiles('orca/deps/**') }}

      - name: CMake
        if: ${{ matrix.arch == 'x64' }}
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.3.0"

      - name: CMake (Windows ARM64; needs 4.2+ for Visual Studio 2026)
        if: ${{ matrix.arch == 'arm64' }}
        run: |
          $ver = "4.3.6"
          $url = "https://github.com/Kitware/CMake/releases/download/v$ver/cmake-$ver-windows-arm64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\cmake.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\cmake.zip" -DestinationPath "$env:RUNNER_TEMP\cmake" -Force
          $cmakeBin = "$env:RUNNER_TEMP\cmake\cmake-$ver-windows-arm64\bin"
          if (-not (Test-Path "$cmakeBin\cmake.exe")) { throw "cmake.exe not found at $cmakeBin" }
          Add-Content -Path $env:GITHUB_PATH -Value $cmakeBin

      - name: MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: MSYS2 with GMP/MPFR (ARM64, as in OrcaSlicer's CI)
        if: ${{ matrix.arch == 'arm64' && steps.deps.outputs.cache-hit != 'true' }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            mingw-w64-clang-aarch64-gmp
            mingw-w64-clang-aarch64-mpfr
            mingw-w64-clang-aarch64-llvm

      - name: Stage ARM64 GMP/MPFR (as in OrcaSlicer's CI)
        if: ${{ matrix.arch == 'arm64' && steps.deps.outputs.cache-hit != 'true' }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          BIN=/clangarm64/bin
          REPO=$(cygpath -u "$GITHUB_WORKSPACE")/orca
          make_import_lib() {
            local dll="$1"; local lib="$2"; local def="/tmp/${dll%.dll}.def"
            echo "EXPORTS" > "$def"
            llvm-readobj --coff-exports "$BIN/$dll" | awk '/Name: /{print $2}' >> "$def"
            llvm-dlltool -m arm64 -D "$dll" -d "$def" -l "$BIN/$lib"
          }
          make_import_lib libgmp-10.dll libgmp-10.lib
          MPFR_DLL=$(ls $BIN/libmpfr-*.dll | head -1 | xargs basename)
          if [ "$MPFR_DLL" != "libmpfr-4.dll" ]; then cp "$BIN/$MPFR_DLL" "$BIN/libmpfr-4.dll"; fi
          make_import_lib libmpfr-4.dll libmpfr-4.lib
          mkdir -p $REPO/deps/GMP/gmp/lib/win-arm64 $REPO/deps/MPFR/mpfr/lib/win-arm64
          cp $BIN/libgmp-10.dll $BIN/libgmp-10.lib $REPO/deps/GMP/gmp/lib/win-arm64/
          cp $BIN/libmpfr-4.dll $BIN/libmpfr-4.lib $REPO/deps/MPFR/mpfr/lib/win-arm64/
          cp /clangarm64/include/gmp.h  $REPO/deps/GMP/gmp/include/
          cp /clangarm64/include/mpfr.h $REPO/deps/MPFR/mpfr/include/ || true

      - name: Build dependencies
        if: ${{ steps.deps.outputs.cache-hit != 'true' }}
        working-directory: orca
        run: |
          choco install strawberryperl -y --no-progress
          .\build_release_vs.bat deps ${{ matrix.bat_arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The batch file doesn't always pass errors on, so check the result.
          if (-not (Test-Path "deps/${{ matrix.dep_dir }}/usr/local/include")) { throw "Dependencies were not built" }

      # Saved right away, so a failing slicer build doesn't lose hours of dependency builds.
      - name: Save dependencies
        if: ${{ steps.deps.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: orca/deps/${{ matrix.dep_dir }}
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Build OrcaSlicer Nonplanar
        working-directory: orca
        run: |
          .\build_release_vs.bat slicer ${{ matrix.bat_arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "${{ matrix.build_dir }}\OrcaSlicer\orca-slicer.exe") -and -not (Test-Path "${{ matrix.build_dir }}\OrcaSlicer\OrcaSlicer.exe")) {
            Get-ChildItem "${{ matrix.build_dir }}\OrcaSlicer" | Select-Object -First 30
            throw "No OrcaSlicer executable in ${{ matrix.build_dir }}\OrcaSlicer"
          }

      - name: Package portable ZIP
        id: zip
        run: |
          $name = "OrcaSlicer-Nonplanar-v$env:NP_VERSION-Windows-${{ matrix.arch }}"
          $stage = "dist\OrcaSlicer Nonplanar"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse -Force "orca\${{ matrix.build_dir }}\OrcaSlicer\*" $stage
          Copy-Item "np\packaging\0.20mm Nonplanar @BBL A1M.json" $stage
          Copy-Item "np\LICENSE" "$stage\LICENSE.txt"
          (Get-Content "np\packaging\README-Windows.txt" -Raw).Replace('@VERSION@', $env:NP_VERSION) |
            Set-Content -Encoding utf8 "$stage\README.txt"
          Compress-Archive -Path $stage -DestinationPath "dist\$name.zip" -CompressionLevel Optimal
          (Get-FileHash "dist\$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Set-Content -Encoding ascii "dist\$name.sha256"
          "ZIP_NAME=$name" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 30

      - name: Nonplanar C++ tests (x64)
        if: ${{ matrix.arch == 'x64' }}
        working-directory: orca/${{ matrix.build_dir }}
        env:
          NONPLANAR_FIXTURES_DIR: ${{ github.workspace }}/np/tests/prusaslicer-nonplanar
          NONPLANAR_ORCA_PROFILES_DIR: ${{ github.workspace }}/np/tests/orcaslicer-nonplanar/profiles
        run: |
          $env:CMAKE_POLICY_VERSION_MINIMUM = "3.5"
          cmake .. -DBUILD_TESTS=ON
          cmake --build . --config Release --target fff_print_tests -- -m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem -Recurse -Filter fff_print_tests.exe | Select-Object -First 1
          # "Support sees the object..." needs a model that is not part of this repository.
          & $exe.FullName '[Nonplanar]~"Scenario: Support sees the object before the conformal shells were moved"'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Slice the test models (x64)
        # Runs even if the C++ tests fail.
        if: ${{ matrix.arch == 'x64' && !cancelled() && steps.zip.outcome == 'success' }}
        run: |
          $exe = Get-ChildItem -Recurse "dist\OrcaSlicer Nonplanar" -Include orca-slicer.exe,OrcaSlicer.exe | Select-Object -First 1
          $p = "np\tests\orcaslicer-nonplanar\profiles"
          $models = @("np\tests\prusaslicer-nonplanar\fixtures\ramp-10deg-hole.stl",
                      "np\tests\prusaslicer-nonplanar\fixtures\wave-retriangulated.stl",
                      "np\tests\prusaslicer-nonplanar\fixtures\triangle-mixed-slope-tessellated.stl",
                      "np\tests\models\angle-test-v1.3-A.stl")
          foreach ($m in $models) {
            $n = [IO.Path]::GetFileNameWithoutExtension($m)
            $out = "slices\$n"
            New-Item -ItemType Directory -Force -Path "$out\data" | Out-Null
            & $exe.FullName --datadir "$out\data" --load-settings "$p\machine.json;$p\process-np.json" --load-filaments "$p\filament.json" `
              --orient 0 --slice 0 --outputdir $out $m | Out-File "$out\slice.log"
            if (-not (Test-Path "$out\plate_1.gcode")) { Get-Content "$out\slice.log" -Tail 20; throw "No G-code for $n" }
            "$n sliced"
          }

      - name: Upload test G-code (x64)
        if: ${{ matrix.arch == 'x64' && !cancelled() && steps.zip.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-gcode-windows-x64
          path: slices/*/plate_1.gcode
          retention-days: 30
